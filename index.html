<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Color Palette</title>
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">
  </head>
  <body>
      <main class="page">

                <!-- Grid with all the boxes -->
                <section class="palette" aria-label="Color palette grid">
                  <!-- Box 1 - dark green, top left -->
                  <div class="grid-element grid-element-1"></div>
                  <!-- Box 2 - green, under box 1 -->
                  <div class="grid-element grid-element-2"></div>
                  <!-- Box 3 - light green, bottom left -->
                  <div class="grid-element grid-element-3"></div>
                  <!-- Box 4 - big box in the middle -->
                  <div class="grid-element grid-element-4"></div>
                  <!-- Box 5 - small box, bottom middle -->
                  <div class="grid-element grid-element-5"></div>
                  <!-- Box 6 - small box, under box 5 -->
                  <div class="grid-element grid-element-6"></div>
                  <!-- Box 7 - wide yellow box, bottom -->
                  <div class="grid-element grid-element-7"></div>
                  <!-- Box 8 - dark green, bottom right -->
                  <div class="grid-element grid-element-8"></div>
                  <!-- Box 9 - bright yellow, top right (bottom one) -->
                  <div class="grid-element grid-element-9"></div>
                  <!-- Box 10 - yellow, top right (middle one) -->
                  <div class="grid-element grid-element-10"></div>
                  <!-- Box 11 - yellow, top right (top one) -->
                  <div class="grid-element grid-element-11"></div>
                </section>

                <!-- Footer -->
                <footer class="footer">
                  <h1>My color palette</h1>
                </footer>

    </main>
  </body>
</html>
